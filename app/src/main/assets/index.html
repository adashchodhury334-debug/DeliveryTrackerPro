<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Tracker Pro</title>
    <style>
        body { background-color: #0d1117; color: #e6edf3; font-family: sans-serif; padding: 12px; margin: 0; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .title { font-size: 18px; font-weight: bold; color: #00E676; }
        .admin-btn { background: #161b22; color: #00E676; border: 1px solid #30363d; padding: 8px 14px; border-radius: 8px; font-weight: bold; }

        .tabs { display: flex; gap: 8px; margin-bottom: 14px; background: #161b22; padding: 4px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; background: transparent; color: #8b949e; border: none; text-align: center; }
        .tab-btn.active { background: #00E676; color: #000; }

        .box { background: #161b22; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #30363d; }
        .box-title { font-size: 13px; font-weight: bold; color: #8b949e; text-transform: uppercase; margin-bottom: 10px; }

        input, textarea { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 14px; margin-bottom: 8px; }
        .btn-green { background: #00E676; color: #000; border: none; font-weight: bold; padding: 12px; width: 100%; border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
        .btn-blue { background: #0284c7; color: #fff; border: none; font-weight: bold; padding: 12px; width: 100%; border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
        .btn-red { background: #da3633; color: #fff; border: none; font-weight: bold; padding: 10px; width: 100%; border-radius: 8px; font-size: 12px; }

        .filter-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .f-btn { flex: 1; padding: 10px; font-size: 12px; font-weight: bold; border-radius: 6px; background: #21262d; color: #8b949e; border: 1px solid #30363d; }
        .f-btn.active { background: #238636; color: #fff; border-color: #2ea043; }

        .hub-box { background: #1c2331; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 2px solid #00E676; }
        .hub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 11px; }
        .grid-item { background: #161b22; padding: 6px; border-radius: 6px; text-align: center; border: 1px solid #30363d; }
        .grid-item span { color: #8b949e; display: block; font-size: 9px; margin-bottom: 2px; }
        .grid-item b { font-size: 12px; font-weight: bold; }

        .perf-card { background: #21262d; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #00E676; border-top: 1px solid #30363d; border-right: 1px solid #30363d; border-bottom: 1px solid #30363d; }
        .perf-header { display: flex; justify-content: space-between; margin-bottom: 8px; }

        .order-item { background: #21262d; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #00E676; display: flex; justify-content: space-between; align-items: center; }
        .btn-copy { background: #30363d; color: #fff; border: 1px solid #484f58; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: flex-end; }
        #modal-content { background: #161b22; width: 100%; max-height: 85vh; border-radius: 16px 16px 0 0; padding: 16px; border-top: 2px solid #00E676; box-sizing: border-box; overflow-y: auto; }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #238636; color: #fff; padding: 10px 18px; border-radius: 20px; font-weight: bold; display: none; z-index: 9999; font-size: 13px; }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div class="header">
        <div class="title">⚡ Delivery Tracker Pro</div>
        <button type="button" class="admin-btn" id="lock-btn" onclick="openAdmin()">🔒 Admin</button>
    </div>

    <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-t" onclick="switchTab('t')">🔍 Tracker</button>
        <button type="button" class="tab-btn" id="tab-p" onclick="switchTab('p')">📊 Performance</button>
    </div>

    <!-- Admin Panel -->
    <div id="admin-sec" style="display:none;" class="box">
        <div id="pin-box">
            <div class="box-title">🔐 Admin PIN</div>
            <input type="password" id="pin-input" placeholder="Enter PIN..." />
            <button type="button" class="btn-green" onclick="checkPin()">Login</button>
        </div>
        <div id="panel-box" style="display:none;">
            <div class="box-title">🔄 Sheet Sync</div>
            <button type="button" class="btn-blue" onclick="syncNow()">🔄 Live Sync Google Sheet</button>
            <div class="box-title" style="margin-top:10px;">📋 Manual Bulk Import</div>
            <textarea id="bulk-input" placeholder="Paste data..."></textarea>
            <button type="button" class="btn-green" onclick="importBulk()">⚡ Import</button>
            <button type="button" class="btn-red" onclick="clearData()">⚠️ Clear All Data</button>
        </div>
    </div>

    <!-- TRACKER TAB -->
    <div id="sec-t">
        <div class="box">
            <div class="box-title">🔍 Quick Search</div>
            <input type="text" id="search-input" placeholder="Enter Tracking ID (4-5 digits)..." oninput="doSearch()" />
        </div>
        <div class="box">
            <div class="box-title">📦 Order Results <span id="active-txt" style="color:#00E676;"></span></div>
            <div id="orders-list"><div style="text-align:center; color:#8b949e;">ऑर्डर खोजने के लिए Tracking ID दर्ज करें</div></div>
        </div>
    </div>

    <!-- PERFORMANCE TAB -->
    <div id="sec-p" style="display:none;">
        <div class="box">
            <div class="filter-row">
                <button type="button" class="f-btn active" id="fb-daily" onclick="filterData('daily')">📅 Daily</button>
                <button type="button" class="f-btn" id="fb-weekly" onclick="filterData('weekly')">📆 Weekly</button>
                <button type="button" class="f-btn" id="fb-monthly" onclick="filterData('monthly')">🗓️ Monthly</button>
            </div>
            
            <div id="hub-card-box"></div>
            
            <div class="box-title" style="margin-top:10px;">👥 Delivery Agents Report</div>
            <div id="agent-list-box"><div style="text-align:center; color:#8b949e;">कोई डेटा नहीं मिला (Admin में जाकर Sync करें)</div></div>
        </div>
    </div>

    <!-- 30 Days History Modal -->
    <div id="modal">
        <div id="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <div>
                    <div id="m-name" style="font-size:16px; font-weight:bold; color:#00E676;">Agent</div>
                    <div id="m-phone" style="font-size:11px; color:#8b949e;"></div>
                </div>
                <button type="button" class="btn-copy" onclick="document.getElementById('modal').style.display='none'">✕ Close</button>
            </div>
            <div id="m-body"></div>
        </div>
    </div>

    <script>
        var isAdmin = false;
        var currentFilter = 'daily';

        function showMsg(text, isErr) {
            var t = document.getElementById('toast');
            t.innerText = text;
            t.style.background = isErr ? '#da3633' : '#238636';
            t.style.display = 'block';
            setTimeout(function() { t.style.display = 'none'; }, 2000);
        }

        function switchTab(t) {
            document.getElementById('sec-t').style.display = (t === 't') ? 'block' : 'none';
            document.getElementById('sec-p').style.display = (t === 'p') ? 'block' : 'none';
            document.getElementById('tab-t').className = (t === 't') ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-p').className = (t === 'p') ? 'tab-btn active' : 'tab-btn';
            if (t === 'p') loadPerf();
        }

        function openAdmin() {
            var sec = document.getElementById('admin-sec');
            sec.style.display = (sec.style.display === 'block') ? 'none' : 'block';
        }

        function checkPin() {
            var val = document.getElementById('pin-input').value.trim();
            if (val === '9547927698') {
                isAdmin = true;
                document.getElementById('pin-box').style.display = 'none';
                document.getElementById('panel-box').style.display = 'block';
                document.getElementById('lock-btn').innerText = '🔓 Logout';
                showMsg('Admin Logged In!');
            } else {
                showMsg('Wrong PIN!', true);
            }
        }

        function syncNow() {
            showMsg('Syncing Google Sheet...');
            setTimeout(function() {
                var added = window.AndroidNative.syncFromSheet();
                if (added >= 0) {
                    showMsg('सफलतापूर्वक ' + added + ' ऑर्डर्स सिंक हो गए!');
                    refreshCount();
                    if (document.getElementById('sec-p').style.display === 'block') loadPerf();
                } else {
                    showMsg('❌ Sync Failed! इंटरनेट चेक करें।', true);
                }
            }, 100);
        }

        function filterData(mode) {
            currentFilter = mode;
            document.getElementById('fb-daily').className = 'f-btn';
            document.getElementById('fb-weekly').className = 'f-btn';
            document.getElementById('fb-monthly').className = 'f-btn';
            document.getElementById('fb-' + mode).className = 'f-btn active';
            loadPerf();
        }

        function loadPerf() {
            var res = JSON.parse(window.AndroidNative.getPerformanceJson(currentFilter));
            var hub = res.hub;
            var agents = res.agents || [];

            // Hub Render
            if (hub) {
                document.getElementById('hub-card-box').innerHTML = 
                    '<div class="hub-box">' +
                        '<div class="hub-header">' +
                            '<div style="font-weight:bold; color:#00E676;">🏢 ' + hub.hubName + '</div>' +
                            '<div style="font-size:11px; background:#382c00; color:#ffca28; padding:3px 6px; border-radius:4px; font-weight:bold;">🎯 Target: ' + hub.target + '</div>' +
                        '</div>' +
                        '<div class="grid-3">' +
                            '<div class="grid-item"><span>TOTAL OFD</span><b style="color:#58a6ff;">' + hub.ofd + '</b></div>' +
                            '<div class="grid-item"><span>TOTAL DEL</span><b style="color:#3fb950;">' + hub.del + '</b></div>' +
                            '<div class="grid-item"><span>TOTAL OFP</span><b style="color:#d29922;">' + hub.ofp + '</b></div>' +
                            '<div class="grid-item"><span>TOTAL PIKED</span><b style="color:#bc8cff;">' + hub.piked + '</b></div>' +
                            '<div class="grid-item"><span>TOTAL DNP</span><b style="color:#38bdf8;">' + hub.dnp + '</b></div>' +
                            '<div class="grid-item"><span>TOTAL DNPC</span><b style="color:#22c55e;">' + hub.dnpc + '</b></div>' +
                            '<div class="grid-item" style="grid-column: span 3; background:#0d1117;">' +
                                '<span>HUB ACTUAL CONVERSION %</span>' +
                                '<b style="color:#f43f5e; font-size:14px;">' + hub.conversionRate + '</b>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
            }

            // Agents Render
            var html = '';
            if (agents.length === 0) {
                html = '<div style="text-align:center; color:#8b949e;">कोई एजेंट डेटा उपलब्ध नहीं है</div>';
            } else {
                agents.forEach(function(item) {
                    var phone = item.mobile ? '<div style="font-size:11px; color:#8b949e;">📞 ' + item.mobile + '</div>' : '';
                    html += 
                        '<div class="perf-card" onclick="openAgentHistory(\'' + item.name + '\', \'' + item.mobile + '\')">' +
                            '<div class="perf-header">' +
                                '<div><div style="font-weight:bold;">👤 ' + item.name + '</div>' + phone + '</div>' +
                            '</div>' +
                            '<div class="grid-3">' +
                                '<div class="grid-item"><span>OFD</span><b style="color:#58a6ff;">' + item.ofd + '</b></div>' +
                                '<div class="grid-item"><span>DEL</span><b style="color:#3fb950;">' + item.del + '</b></div>' +
                                '<div class="grid-item"><span>OFP</span><b style="color:#d29922;">' + item.ofp + '</b></div>' +
                                '<div class="grid-item"><span>PIKED</span><b style="color:#bc8cff;">' + item.piked + '</b></div>' +
                                '<div class="grid-item"><span>DNP</span><b style="color:#38bdf8;">' + item.dnp + '</b></div>' +
                                '<div class="grid-item"><span>DNPC</span><b style="color:#22c55e;">' + item.dnpc + '</b></div>' +
                                '<div class="grid-item" style="grid-column: span 3;">' +
                                    '<span>CONVERSATION %</span><b style="color:#f43f5e;">' + item.conversionRate + '</b>' +
                                '</div>' +
                            '</div>' +
                        '</div>';
                });
            }
            document.getElementById('agent-list-box').innerHTML = html;
        }

        function openAgentHistory(name, mobile) {
            document.getElementById('m-name').innerText = '👤 ' + name;
            document.getElementById('m-phone').innerText = mobile ? '📞 ' + mobile : '';
            var list = JSON.parse(window.AndroidNative.getAgentHistory(name, mobile));
            var html = '';
            list.forEach(function(d) {
                html += 
                    '<div style="background:#21262d; border-radius:8px; padding:10px; margin-bottom:8px;">' +
                        '<div style="display:flex; justify-content:space-between; margin-bottom:6px;">' +
                            '<span style="color:#58a6ff; font-weight:bold;">📅 ' + d.date + '</span>' +
                            '<span style="color:#f43f5e; font-weight:bold;">Conv: ' + d.conv + '</span>' +
                        '</div>' +
                        '<div class="grid-3">' +
                            '<div class="grid-item">OFD: <b>' + d.ofd + '</b></div>' +
                            '<div class="grid-item">DEL: <b>' + d.del + '</b></div>' +
                            '<div class="grid-item">OFP: <b>' + d.ofp + '</b></div>' +
                            '<div class="grid-item">PIK: <b>' + d.piked + '</b></div>' +
                            '<div class="grid-item">DNP: <b>' + d.dnp + '</b></div>' +
                            '<div class="grid-item">DNPC: <b>' + d.dnpc + '</b></div>' +
                        '</div>' +
                    '</div>';
            });
            document.getElementById('m-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        function doSearch() {
            var q = document.getElementById('search-input').value.trim();
            var list = document.getElementById('orders-list');
            if (!q) {
                list.innerHTML = '<div style="text-align:center; color:#8b949e;">ऑर्डर खोजने के लिए Tracking ID दर्ज करें</div>';
                return;
            }
            var arr = JSON.parse(window.AndroidNative.searchByTrackingId(q));
            if (arr.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#8b949e;">❌ No Order ID found</div>';
                return;
            }
            var html = '';
            arr.forEach(function(item) {
                html += 
                    '<div class="order-item">' +
                        '<div>' +
                            '<div style="font-size:11px; color:#8b949e;">Track: ' + item.t + '</div>' +
                            '<div style="font-size:14px; font-weight:bold; color:#3fb950;">' + item.o + '</div>' +
                        '</div>' +
                        '<button type="button" class="btn-copy" onclick="copyText(\'' + item.o + '\')">Copy</button>' +
                    '</div>';
            });
            list.innerHTML = html;
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            showMsg('Order ID Copied: ' + txt);
        }

        function clearData() {
            window.AndroidNative.deleteAll();
            refreshCount();
            doSearch();
            showMsg('डेटा डिलीट हो गया!');
        }

        function importBulk() {
            var txt = document.getElementById('bulk-input').value.trim();
            if (!txt) return;
            var lines = txt.split(/\r?\n/);
            var items = [];
            for (var i = 0; i < lines.length; i++) {
                var p = lines[i].split(/[\t,]/).map(function(s){ return s.trim(); });
                if (p.length >= 2 && p[0] && p[1] && !p[0].toUpperCase().includes('TRACKING')) {
                    items.push({ t: p[0], o: p[1] });
                }
            }
            var c = window.AndroidNative.insertBulk(JSON.stringify(items));
            document.getElementById('bulk-input').value = '';
            showMsg(c + ' Orders Imported!');
            refreshCount();
            doSearch();
        }

        function refreshCount() {
            var n = window.AndroidNative.getTotalCount();
            document.getElementById('active-txt').innerText = '(Active: ' + n + ')';
        }

        refreshCount();
    </script>
</body>
</html>
