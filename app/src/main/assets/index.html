<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delivery Tracker Pro</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0d1117; color: #e6edf3; padding: 12px; min-height: 100vh; padding-bottom: 70px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .title { font-size: 18px; font-weight: 800; color: #00E676; letter-spacing: 0.5px; }
        .admin-btn { background: #161b22; color: #00E676; border: 1px solid #30363d; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }

        .tabs { display: flex; gap: 8px; margin-bottom: 14px; background: #161b22; padding: 4px; border-radius: 10px; border: 1px solid #30363d; }
        .tab-btn { flex: 1; padding: 12px; font-size: 14px; font-weight: 700; border-radius: 8px; background: transparent; color: #8b949e; border: none; text-align: center; cursor: pointer; }
        .tab-btn.active { background: #00E676; color: #000; }

        .box { background: #161b22; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #30363d; }
        .box-title { font-size: 13px; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 14px; outline: none; margin-bottom: 8px; }
        .btn-green { background: #00E676; color: #000; border: none; font-weight: bold; padding: 12px; width: 100%; border-radius: 8px; font-size: 13px; margin-bottom: 8px; cursor: pointer; }
        .btn-blue { background: #0284c7; color: #fff; border: none; font-weight: bold; padding: 12px; width: 100%; border-radius: 8px; font-size: 13px; margin-bottom: 8px; cursor: pointer; }
        .btn-red { background: #da3633; color: #fff; border: none; font-weight: bold; padding: 10px; width: 100%; border-radius: 8px; font-size: 12px; cursor: pointer; }

        .filter-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .f-btn { flex: 1; padding: 10px; font-size: 12px; font-weight: 700; border-radius: 6px; background: #21262d; color: #8b949e; border: 1px solid #30363d; cursor: pointer; text-align: center; }
        .f-btn.active { background: #238636; color: #fff; border-color: #2ea043; }

        .hub-box { background: #1c2331; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 2px solid #00E676; }
        .hub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        .hl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .hl-box { background: #21262d; padding: 10px; border-radius: 8px; border: 1px solid #30363d; overflow: hidden; }
        .hl-box.green { border-left: 3px solid #00E676; }
        .hl-box.blue { border-left: 3px solid #38bdf8; }
        .hl-title { font-size: 10px; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-bottom: 3px; }
        .hl-name { font-size: 13px; font-weight: 700; color: #f0f6fc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hl-stat { font-size: 13px; font-weight: 800; margin-top: 2px; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; font-size: 11px; }
        .grid-item { background: #161b22; padding: 6px; border-radius: 5px; text-align: center; border: 1px solid #30363d; }
        .grid-item span { color: #8b949e; display: block; font-size: 9px; margin-bottom: 1px; font-weight: 600; }
        .grid-item b { font-size: 12px; font-weight: 700; }

        .perf-card { background: #21262d; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid #30363d; border-left: 4px solid #00E676; cursor: pointer; }
        .perf-header { display: flex; justify-content: space-between; margin-bottom: 8px; }

        .order-item { background: #21262d; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #00E676; display: flex; justify-content: space-between; align-items: center; }
        .btn-copy { background: #30363d; color: #fff; border: 1px solid #484f58; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: flex-end; }
        #modal-content { background: #161b22; width: 100%; max-height: 85vh; border-radius: 16px 16px 0 0; padding: 16px; border-top: 2px solid #00E676; box-sizing: border-box; overflow-y: auto; }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #238636; color: #fff; padding: 10px 18px; border-radius: 20px; font-weight: bold; display: none; z-index: 9999; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div class="header">
        <div class="title">⚡ Delivery Tracker Pro</div>
        <button type="button" class="admin-btn" id="lock-btn" onclick="openAdmin()">🔒 Admin</button>
    </div>

    <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-t" onclick="switchTab('t')">🔍 Tracker</button>
        <button type="button" class="tab-btn" id="tab-p" onclick="switchTab('p')">📊 Performance</button>
    </div>

    <!-- Admin Panel -->
    <div id="admin-sec" style="display:none;" class="box">
        <div id="pin-box">
            <div class="box-title">🔐 Admin PIN</div>
            <input type="password" id="pin-input" placeholder="Enter PIN..." />
            <button type="button" class="btn-green" onclick="checkPin()">Login</button>
        </div>
        <div id="panel-box" style="display:none;">
            <div class="box-title">🔄 Sheet Sync</div>
            <button type="button" class="btn-blue" onclick="syncNow()">🔄 Live Sync Google Sheet</button>
            <div class="box-title" style="margin-top:10px;">📋 Manual Bulk Import</div>
            <textarea id="bulk-input" placeholder="Paste data..."></textarea>
            <button type="button" class="btn-green" onclick="importBulk()">⚡ Import</button>
            <button type="button" class="btn-red" onclick="clearData()">⚠️ Clear All Data</button>
        </div>
    </div>

    <!-- TRACKER TAB -->
    <div id="sec-t">
        <div class="box">
            <div class="box-title">🔍 Quick Search</div>
            <input type="text" id="search-input" placeholder="Enter Tracking ID (FMPC...)..." oninput="doSearch()" />
        </div>
        <div class="box">
            <div class="box-title">📦 Order Results <span id="active-txt" style="color:#00E676;"></span></div>
            <div id="orders-list"><div style="text-align:center; color:#8b949e;">ऑर्डर खोजने के लिए Tracking ID (FMPC...) दर्ज करें</div></div>
        </div>
    </div>

    <!-- PERFORMANCE TAB -->
    <div id="sec-p" style="display:none;">
        <div class="box">
            <div class="filter-row">
                <button type="button" class="f-btn active" id="fb-daily" onclick="filterData('daily')">📅 Daily</button>
                <button type="button" class="f-btn" id="fb-weekly" onclick="filterData('weekly')">📆 Weekly</button>
                <button type="button" class="f-btn" id="fb-monthly" onclick="filterData('monthly')">🗓️ Monthly</button>
            </div>
            
            <div id="hub-card-box"></div>
            <div class="hl-grid" id="leaderboard-box"></div>
            
            <div class="box-title" style="margin-top:10px;">👥 Delivery Agents Report</div>
            <div id="agent-list-box"><div style="text-align:center; color:#8b949e;">कोई डेटा नहीं मिला (Admin में जाकर Sync करें)</div></div>
        </div>
    </div>

    <!-- 30 Days History Modal -->
    <div id="modal">
        <div id="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <div>
                    <div id="m-name" style="font-size:16px; font-weight:bold; color:#00E676;">Agent</div>
                    <div id="m-phone" style="font-size:11px; color:#8b949e;"></div>
                </div>
                <button type="button" class="btn-copy" onclick="document.getElementById('modal').style.display='none'">✕ Close</button>
            </div>
            <div id="m-body"></div>
        </div>
    </div>

    <script>
        var isAdmin = false;
        var currentFilter = 'daily';
        var toastTimer = null;

        function showMsg(text, isErr) {
            try {
                var t = document.getElementById('toast');
                t.innerText = text;
                t.style.background = isErr ? '#da3633' : '#238636';
                t.style.display = 'block';
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function() { t.style.display = 'none'; }, 2200);
            } catch(e){}
        }

        function switchTab(t) {
            try {
                if (document.activeElement) document.activeElement.blur();
                document.getElementById('sec-t').style.display = (t === 't') ? 'block' : 'none';
                document.getElementById('sec-p').style.display = (t === 'p') ? 'block' : 'none';
                document.getElementById('tab-t').className = (t === 't') ? 'tab-btn active' : 'tab-btn';
                document.getElementById('tab-p').className = (t === 'p') ? 'tab-btn active' : 'tab-btn';
                if (t === 'p') {
                    loadPerf();
                }
            } catch(e) {
                console.error(e);
            }
        }

        function openAdmin() {
            try {
                if (document.activeElement) document.activeElement.blur();
                var sec = document.getElementById('admin-sec');
                sec.style.display = (sec.style.display === 'block') ? 'none' : 'block';
            } catch(e) {
                console.error(e);
            }
        }

        function checkPin() {
            try {
                var input = document.getElementById('pin-input');
                var val = input ? input.value.trim() : '';
                if (val === '9547927698') {
                    isAdmin = true;
                    if (input) input.value = '';
                    document.getElementById('pin-box').style.display = 'none';
                    document.getElementById('panel-box').style.display = 'block';
                    document.getElementById('lock-btn').innerText = '🔓 Logout';
                    showMsg('Admin Logged In!');
                } else {
                    showMsg('Wrong PIN!', true);
                }
            } catch(e) {
                console.error(e);
            }
        }

        function syncNow() {
            showMsg('Syncing Google Sheet...');
            setTimeout(function() {
                try {
                    if (window.AndroidNative && typeof window.AndroidNative.syncFromSheet === 'function') {
                        var added = window.AndroidNative.syncFromSheet();
                        if (added >= 0) {
                            showMsg('सफलतापूर्वक ' + added + ' ऑर्डर्स सिंक हो गए!');
                            refreshCount();
                            if (document.getElementById('sec-p').style.display === 'block') {
                                loadPerf();
                            }
                        } else {
                            showMsg('❌ Sync Failed! इंटरनेट चेक करें।', true);
                        }
                    }
                } catch(e) {
                    showMsg('Sync Error: ' + e, true);
                }
            }, 100);
        }

        function filterData(mode) {
            try {
                currentFilter = mode;
                document.getElementById('fb-daily').className = 'f-btn';
                document.getElementById('fb-weekly').className = 'f-btn';
                document.getElementById('fb-monthly').className = 'f-btn';
                document.getElementById('fb-' + mode).className = 'f-btn active';
                loadPerf();
            } catch(e) {
                console.error(e);
            }
        }

        function loadPerf() {
            try {
                var jsonStr = "{}";
                if (window.AndroidNative && typeof window.AndroidNative.getPerformanceJson === 'function') {
                    jsonStr = window.AndroidNative.getPerformanceJson(currentFilter);
                }
                
                var res = JSON.parse(jsonStr || "{}");
                var hub = res.hub;
                var agents = res.agents || [];

                if (hub) {
                    document.getElementById('hub-card-box').innerHTML = 
                        '<div class="hub-box">' +
                            '<div class="hub-header">' +
                                '<div style="font-weight:bold; color:#00E676; font-size:15px;">🏢 ' + hub.hubName + '</div>' +
                                '<div style="font-size:11px; background:#382c00; color:#ffca28; padding:3px 6px; border-radius:4px; font-weight:bold;">🎯 Target: ' + hub.target + '</div>' +
                            '</div>' +
                            '<div class="grid-3">' +
                                '<div class="grid-item"><span>TOTAL OFD</span><b style="color:#58a6ff;">' + hub.ofd + '</b></div>' +
                                '<div class="grid-item"><span>TOTAL DEL</span><b style="color:#3fb950;">' + hub.del + '</b></div>' +
                                '<div class="grid-item"><span>TOTAL OFP</span><b style="color:#d29922;">' + hub.ofp + '</b></div>' +
                                '<div class="grid-item"><span>TOTAL PIKED</span><b style="color:#bc8cff;">' + hub.piked + '</b></div>' +
                                '<div class="grid-item"><span>TOTAL DNP</span><b style="color:#38bdf8;">' + hub.dnp + '</b></div>' +
                                '<div class="grid-item"><span>TOTAL DNPC</span><b style="color:#22c55e;">' + hub.dnpc + '</b></div>' +
                                '<div class="grid-item" style="grid-column: span 3; background:#0d1117; border-color:#00E676;">' +
                                    '<span>HUB ACTUAL CONVERSION %</span>' +
                                    '<b style="color:#f43f5e; font-size:14px;">' + hub.conversionRate + '</b>' +
                                '</div>' +
                            '</div>' +
                        '</div>';
                }

                var topConv = null, topDnpc = null;
                var maxConv = -1, maxDnpc = -1;

                agents.forEach(function(item) {
                    if (item.conversionNum > maxConv && item.dnp > 0) {
                        maxConv = item.conversionNum;
                        topConv = item;
                    }
                    if (item.dnpc > maxDnpc) {
                        maxDnpc = item.dnpc;
                        topDnpc = item;
                    }
                });

                if (topConv || topDnpc) {
                    document.getElementById('leaderboard-box').innerHTML = 
                        '<div class="hl-box green">' +
                            '<div class="hl-title">🏆 Top Conv %</div>' +
                            '<div class="hl-name">' + (topConv ? topConv.name : 'N/A') + '</div>' +
                            '<div class="hl-stat" style="color:#3fb950;">' + (topConv ? topConv.conversionRate : '0%') + '</div>' +
                        '</div>' +
                        '<div class="hl-box blue">' +
                            '<div class="hl-title">⚡ Top DNPC (Done)</div>' +
                            '<div class="hl-name">' + (topDnpc ? topDnpc.name : 'N/A') + '</div>' +
                            '<div class="hl-stat" style="color:#38bdf8;">' + (topDnpc ? topDnpc.dnpc + ' Done' : '0') + '</div>' +
                        '</div>';
                } else {
                    document.getElementById('leaderboard-box').innerHTML = '';
                }

                var html = '';
                if (agents.length === 0) {
                    html = '<div style="text-align:center; color:#8b949e; padding:12px 0;">कोई एजेंट डेटा उपलब्ध नहीं है</div>';
                } else {
                    agents.forEach(function(item) {
                        var phone = item.mobile ? '<div style="font-size:11px; color:#8b949e;">📞 ' + item.mobile + '</div>' : '';
                        html += 
                            '<div class="perf-card" onclick="openAgentHistory(\'' + item.name + '\', \'' + item.mobile + '\')">' +
                                '<div class="perf-header">' +
                                    '<div><div style="font-weight:bold; font-size:14px; color:#f0f6fc;">👤 ' + item.name + '</div>' + phone + '</div>' +
                                '</div>' +
                                '<div class="grid-3">' +
                                    '<div class="grid-item"><span>OFD</span><b style="color:#58a6ff;">' + item.ofd + '</b></div>' +
                                    '<div class="grid-item"><span>DEL</span><b style="color:#3fb950;">' + item.del + '</b></div>' +
                                    '<div class="grid-item"><span>OFP</span><b style="color:#d29922;">' + item.ofp + '</b></div>' +
                                    '<div class="grid-item"><span>PIKED</span><b style="color:#bc8cff;">' + item.piked + '</b></div>' +
                                    '<div class="grid-item"><span>DNP</span><b style="color:#38bdf8;">' + item.dnp + '</b></div>' +
                                    '<div class="grid-item"><span>DNPC</span><b style="color:#22c55e;">' + item.dnpc + '</b></div>' +
                                    '<div class="grid-item" style="grid-column: span 3;">' +
                                        '<span>CONVERSATION %</span><b style="color:#f43f5e;">' + item.conversionRate + '</b>' +
                                    '</div>' +
                                '</div>' +
                            '</div>';
                    });
                }
                document.getElementById('agent-list-box').innerHTML = html;
            } catch(err) {
                document.getElementById('agent-list-box').innerHTML = '<div style="text-align:center; color:#8b949e;">डेटा लोड करने में त्रुटि (Admin में जाकर Sync करें)</div>';
            }
        }

        function openAgentHistory(name, mobile) {
            try {
                document.getElementById('m-name').innerText = '👤 ' + name;
                document.getElementById('m-phone').innerText = mobile ? '📞 ' + mobile : '';
                var list = [];
                if (window.AndroidNative && typeof window.AndroidNative.getAgentHistory === 'function') {
                    list = JSON.parse(window.AndroidNative.getAgentHistory(name, mobile) || "[]");
                }
                var html = '';
                if (list.length === 0) {
                    html = '<div style="text-align:center; color:#8b949e; padding:12px 0;">कोई 30 दिन का इतिहास नहीं मिला</div>';
                } else {
                    list.forEach(function(d) {
                        html += 
                            '<div style="background:#21262d; border-radius:8px; padding:10px; margin-bottom:8px;">' +
                                '<div style="display:flex; justify-content:space-between; margin-bottom:6px;">' +
